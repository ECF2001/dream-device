[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dreamcare-mcp"
version = "0.1.0"
description = "Model Context Protocol server for Dream Device medication reminders"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Emilio Conejo" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["dreamcare_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
